name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    name: Ruby syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Ruby syntax
        run: find . -name "*.rb" -print0 | xargs -0 -n1 ruby -c

  test:
    name: Redmine 7.0.1 plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run plugin tests on redmine:7.0.1
        run: bash test/run-redmine-7.0.1.sh
